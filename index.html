function sheet(){const p=P[cur],h=p.hdr,dep=h['DEPENDE DE']!==undefined?'DEPENDE DE':'REPORTA A',H=k=>fld(k,'hdr|'+k,h[k]);
return `<div class="hd"><img src="${LOGO}" alt=""><div><b>MANUAL DE ORGANIZACIÓN</b><h2>PERFIL DE PUESTO</h2></div><span></span></div>
<div class="g">${fld('Fecha de elaboración','fecha_elab',p.fecha_elab)}${fld('Fecha de revisión','fecha_rev',p.fecha_rev)}${fld('Departamento','departamento_hdr',p.departamento_hdr)}${fld('Elaborado por','elaborado_por',p.elaborado_por)}</div>
<div class="sec">PERFIL DEL CARGO</div>
<div class="f w"><label>PUESTO:</label>${ed('puesto',p.puesto).replace('class="ed"','class="ed puesto"')}</div>
<div class="g">${H('DEPARTAMENTO')}${H('CÓDIGO DEL CARGO')}${H('TIPO DE PUESTO')}${H('TIPO DE JORNADA')}${fld(dep,'hdr|'+dep,h[dep])}${H('SUPERVISA A')}${H('EDAD PARA CONTRATACIÓN')}${H('GÉNERO')}${H('RANGO DE SALARIO')}</div>
<div class="sec">OBJETIVO DEL PUESTO</div>${ed('objetivo',p.objetivo,'p')}
<div class="sec">DESCRIPCIÓN DEL PUESTO</div>${lst('funciones',p.funciones)}<p style="margin:8px 0 0;font-style:italic">${ed('otras',p.otras)}</p>
<div class="sec">ANÁLISIS DE COMPETENCIAS NECESARIAS PARA EL PUESTO</div>
<div class="sub">GRADO ACADÉMICO / ÁREA DE ESTUDIO</div><table>${p.educacion.map((e,i)=>`<tr><td>${esc(e.nivel)}</td><td class="xc" data-tg="${i}">${e.x?'X':''}</td><td>${ed('educacion|'+i+'|area',e.area)}</td></tr>`).join('')}</table>
<div class="sub">EXPERIENCIA MÍNIMA EN EL PUESTO</div><table class="exp"><tr class="h">${p.exp_labels.map(l=>`<td>${esc(l)}</td>`).join('')}</tr><tr>${p.exp_vals.map((v,i)=>`<td>${ed('exp_vals|'+i,v)}</td>`).join('')}</tr><tr><td colspan="4" style="text-align:left"><b>OBSERV.:</b> ${ed('exp_obs',p.exp_obs)}</td></tr></table>
<div class="sec">COMPETENCIAS DEL PUESTO</div>
<div class="two"><div><div class="sub">CONOCIMIENTOS GENERALES</div>${lst('generales',p.generales)}</div><div><div class="sub">COMPETENCIAS DE SEGURIDAD</div>${lst('seguridad',p.seguridad)}</div></div>
<div class="sub">COMPETENCIAS TÉCNICAS</div>${lst('tecnicas',p.tecnicas)}
<div class="sub">COMPETENCIAS CONDUCTUALES</div>${lst('conductuales',p.conductuales,'c2')}
<div class="sec">CAPACITACIÓN Y CERTIFICACIONES</div>
<div class="two"><div><div class="sub">CERTIFICACIONES DESEABLES</div>${lst('certificaciones',p.certificaciones)}</div><div><div class="sub">CAPACITACIÓN INTERNA</div>${lst('capacitacion',p.capacitacion)}</div></div>
<div class="sec">CONDICIONES DE PUESTO</div>${lst('condiciones',p.condiciones)}
<div class="sg">${p.firmas.map((f,i)=>`<div><b>${esc(f.rol)}</b><div class="ln">${ed('firmas|'+i+'|nombre',f.nombre,'div')}${ed('firmas|'+i+'|cargo',f.cargo,'div')}</div></div>`).join('')}</div>`}
function side(){const q=$('#q').value.toLowerCase();$('#lst').innerHTML=P.map((p,i)=>[p,i]).filter(([p])=>(p.puesto+p.hdr['CÓDIGO DEL CARGO']).toLowerCase().includes(q)).map(([p,i])=>`<button class="it ${i==cur?'on':''}" data-i="${i}">${esc(p.puesto)}<small>${esc(p.hdr['CÓDIGO DEL CARGO']||'')} · ${esc(p.hdr['DEPARTAMENTO']||'')}</small></button>`).join('');$('#cnt').textContent=P.length+' perfiles'}
function ad(){const a=ads[cur];$('#pv').innerHTML=a?`<img src="${a}" alt="Anuncio">`:'';$('#adp').innerHTML=a?`<img src="${a}" alt="">`:'';$('#bx').style.display=$('#bn').style.display=a?'':'none'}
function render(){$('#sh').innerHTML=sheet();$('#sh').classList.toggle('edm',edit);$('#be').textContent=edit?'✔ Terminar edición':'✏️ Editar';$('#be').classList.toggle('on',edit);side();ad()}
$('#lg').src=LOGO;
document.addEventListener('input',e=>{const el=e.target.closest('[data-p]');if(!el)return;const k=key(el.dataset.p),l=k.pop();walk(P[cur],k)[l]=el.textContent;save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.ed')){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',e=>{if(e.target.closest('.ed')){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\s+/g,' '))}});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('.ed'))side()});
document.addEventListener('click',e=>{const t=e.target;let b;
if(b=t.closest('[data-i]')){cur=+b.dataset.i;render();scrollTo(0,0)}
else if(b=t.closest('[data-del]')){const k=key(b.dataset.del),i=k.pop();walk(P[cur],k).splice(i,1);save();render()}
else if(b=t.closest('[data-add]')){walk(P[cur],key(b.dataset.add)).push('Nuevo elemento');save();render()}
else if(edit&&(b=t.closest('[data-tg]'))){const e2=P[cur].educacion[+b.dataset.tg];e2.x=!e2.x;save();render()}});
$('#q').oninput=side;
$('#be').onclick=()=>{edit=!edit;render()};
const pr=m=>{document.body.dataset.pm=m;setTimeout(()=>{window.print();setTimeout(()=>delete document.body.dataset.pm,400)},50)};
$('#bp').onclick=()=>pr('perfil');$('#bn').onclick=()=>pr('anuncio');
$('#br').onclick=()=>{if(confirm('¿Restaurar este perfil a su versión original del Excel? Se perderán tus cambios en este puesto.')){P[cur]=JSON.parse(JSON.stringify(ORIG[cur]));save();render()}};
$('#ba').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ads[cur]=c.toDataURL('image/jpeg',.85);try{localStorage.setItem('dae_ad1',JSON.stringify(ads))}catch(x){toast('Imagen cargada, pero no cabe en el almacenamiento del navegador: no se guardará al cerrar.')}ad()};i.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('#bx').onclick=()=>{delete ads[cur];try{localStorage.setItem('dae_ad1',JSON.stringify(ads))}catch(x){}ad()};
render();
</script></body></html>
